<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMHub</title>
<meta name="robots" content="noindex">
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf9f7;color:#1c1b19;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}a{color:#1f3a45;text-decoration:none;font-size:15px}</style>
</head>
<body>
  <p><a id="fallback" href="./PMHub.html">正在打开 PMHub…</a></p>
  <script>
  /* 旧文件名转发页：应用主文件已更名为 PMHub.html，此文件仅为存量分享链接保留。
     必须带上 location.search（如 ?project=xxx 与 ?settings=ai），否则旧链接打开后会丢项目。
     无 JS 时下方的链接仍可手动打开（此时参数会丢失，但至少不会 404）。 */
  (function () {
    var target = './PMHub.html' + location.search + location.hash;
    var a = document.getElementById('fallback');
    if (a) { a.href = target; }
    location.replace(target);
  })();
  </script>
</body>
</html>
